desc: The ``$lib.model.migration.fuse()`` Storm API requires global admin permissions
  and operates on the entire Cortex rather than the current view. Every layer is processed,
  so the source node is removed from all views. Read-only and mirrored layers cannot
  be modified and are skipped with a warning. Property placement is preserved, so
  each value is written to the layer it was already stored in and property merges
  only occur within a layer.
