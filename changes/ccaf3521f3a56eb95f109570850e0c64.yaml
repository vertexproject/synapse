desc: Updated the ``aha.svc.mirror`` Storm command and the ``synapse.tools.aha.mirror``
  tool to identify mirror group members by their shared service iden. Mirror groups are
  now displayed even when no service has claimed the group leader name. Added a ``follows``
  column which displays the service that each member mirrors from, and a ``Group Leader``
  line which displays the service currently reporting itself as the leader. The two
  now produce identical output, and both report ``No mirror groups found.`` when there
  are no mirror groups to display.
