name: acme-hello
version: 0.0.1

dependencies:
  synapse:
    version: '>=3.0.0,<4.0.0'

genopts:
    dotstorm: true # Specify that storm command/module files end with ".storm"

author:
  url: https://acme.newp
  name: ACME Explosives and Anvils

desc: Acme-Hello is a minimal example of a Rapid Power-Up.

perms:
  - perm: [ acme, hello, user ]
    gate: cortex
    desc: Allows a user to call privileged APIs from Acme-Hello.

modules:

  # apidefs document a module's exported functions. They are what
  # "mdautodoc --stormpkg" renders into the Storm Modules reference, so a
  # function with no apidef is importable but undocumented.
  - name: acme.hello
    apidefs:
      - name: woot
        desc: Print a message to the Storm runtime.
        type:
          type: function
          args:
            - name: text
              type: str
              desc: The message to print.
          returns:
            type: 'null'
            desc: Always returns null.

  - name: acme.hello.privsep
    asroot:perms:
        - [ acme, hello, user ]
    apidefs:
      - name: getFooByBar
        desc: |
          Look up a foo by its bar using the Acme API.

          The API key is read from protected storage and used on the caller's
          behalf, so a caller who may import this module never sees the key.
        type:
          type: function
          args:
            - name: bar
              type: str
              desc: The bar value to look up.
          returns:
            type: dict
            desc: The decoded JSON response, or null if the API call failed.

commands:

  - name: acme.hello.sayhi
    desc: Print the hello message.

  - name: acme.hello.omgopts
    desc: |
        This is a multi-line description containing usage examples.
  
        // Run the command with some nodes
        inet:fqdn=acme.newp | acme.hello.omgopts vertex.link
  
        // Run the command with some command line switches
        acme.hello.omgopts --debug --hehe haha vertex.link
  
    cmdargs:
  
      - - --hehe
        - type: str
          help: The value of the hehe optional input.
  
      - - --debug
        - type: bool
          default: false
          action: store_true
          help: Enable debug output.
  
      - - fqdn
        - type: str
          help: A mandatory / positional command line argument.

  - name: acme.hello.mayyield
    desc: |
         Take in an FQDN and make DNS A records to demo --yield

         inet:fqdn=vertex.link | acme.hello.mayyield

    cmdargs:

      - - --yield
        - default: false
          action: store_true
          help: Yield the newly created inet:dns:a records rather than the input inet:fqdn nodes.
