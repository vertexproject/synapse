# Synapse v2 -> v3 model name map.
#
# Maps retired v2 form, property, interface, and type names to what they
# became in v3 and/or how to model the concept now. Powers "Did you mean?"
# lookups, migration, and is exposed to APIs under the model dict "v2map" key.
#
# Each entry under changes: is keyed by the retired v2 name and may declare:
#   became:  the single current v3 name it became (omit if removed outright)
#   goals:   list of ids referencing the shared strategic goals table below
#   reason:  a specific reason for this change that does not fit the shared goals
#   props:   changed properties of the (current) form, keyed by their
#            relative v2 name; each has its own became (relative)/goals/reason.
# An entry must provide at least one of became, reason, or props.
#
# This file replaces the legacy per-def prevnames key.

goals:
  ip-version-agnostic:
    title: Unify IPv4 and IPv6
    doc: Represent IPv4 and IPv6 with single version-agnostic forms, types, and properties.
  taxonomy-convention:
    title: Standardize taxonomy naming
    doc: Apply the consistent v3 `type`/`type:taxonomy` naming convention to enumerated and taxonomy elements.
  interval-consolidated:
    title: Model time spans as intervals
    doc: Replace paired begin/end (or first/last) time properties with a single interval (ival) `:period` property.
  eitheror-removed:
    title: Remove either/or properties
    doc: Eliminate mutually exclusive (either/or) properties by merging the alternatives into a single property, including collapsing separate type-specific variants into one value property.
  model-refinement:
    title: Refine to match current understanding
    doc: Update the model to reflect our current understanding of the true structure, analytical relevance, and use cases, correcting early over-simplifications or an expanded need for detail.
  causal-ledto:
    title: Unify causal relationships
    doc: Represent causal relationships between any `meta:causal` forms with the `-(ledto)>` edge instead of form-specific properties.
  renamed:
    title: Clarify and standardize names
    doc: Rename or relocate forms, properties, types, and interfaces for clarity and consistency.

